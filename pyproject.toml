[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vlm-judge"
version = "0.1.0"
description = "Reference-aware evaluation pipeline for multimodal homework agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.3",
    "langchain-openai>=0.2",
    "langgraph>=0.2",
    "bm25s>=0.2",
    "PyStemmer>=2.2",
    "faiss-cpu>=1.8",
    "numpy>=1.26",
    "packaging>=23",
    "peft==0.20.0",
    "Pillow>=10.0",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.2",
    "pytesseract>=0.3.10",
    "requests>=2.31",
    # 5.4+ imports optional TorchCodec modalities at package import time. The
    # retrieval pipeline is text-only and shares an environment with vLLM,
    # whose TorchCodec build may not have matching FFmpeg shared libraries.
    "sentence-transformers>=3.0,<5.4",
    "tqdm>=4.66",
]

[project.optional-dependencies]
sources = ["openpyxl>=3.1"]
dev = ["pytest>=8"]
tracing = ["langfuse>=3"]
deep-search = ["trafilatura>=2.0"]
official-source = ["pypdf>=6.10,<7", "pdfplumber>=0.11,<1"]
# Визуальный ретрив. colpali-engine импортируется лениво внутри загрузчика
# энкодера, поэтому без этого extra падение приходит не на старте, а на первом
# запросе поиска, посреди прогона.
visual = ["colpali-engine>=0.3,<1"]

[project.scripts]
vlm-judge = "vlm_judge.cli:main"
vlm-judge-ui = "vlm_judge.ui_server:main"
vlm-retrieval-api = "vlm_judge.retrieval_server:main"
mla-baseline = "mla_baseline.runner:main"
textbook-index = "retrieve.ingest.build_index:main"
textbook-eval = "retrieve.evaluation.evaluate:main"
visual-search-service = "visual_retrive.search_service:main"
visual-preflight = "mla_baseline.visual_preflight:main"
visual-calibrate = "retrieve.evaluation.calibrate_visual:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vlm_judge = ["ui/*.html", "ui/*.css", "ui/*.js"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "live_qwen: opt-in smoke tests that require a running Qwen vLLM server",
]
