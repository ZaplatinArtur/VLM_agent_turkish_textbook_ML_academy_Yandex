[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vlm-judge"
version = "0.1.0"
description = "Reference-aware evaluation pipeline for multimodal homework agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
sources = ["openpyxl>=3.1"]
dev = ["pytest>=8"]

[project.scripts]
vlm-judge = "vlm_judge.cli:main"
vlm-judge-ui = "vlm_judge.ui_server:main"
vlm-retrieval-api = "vlm_judge.retrieval_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vlm_judge = ["ui/*.html", "ui/*.css", "ui/*.js"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
