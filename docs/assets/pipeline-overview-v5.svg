<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" role="img" aria-labelledby="title desc">
  <title id="title">Путь задания через систему</title>
  <desc id="desc">Задание проходит проверку официального источника. При точном совпадении возвращается ответ из ключа. Иначе агент решает задачу и при необходимости обращается к поиску по учебникам. Обе ветки завершаются единым результатом и оценкой.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07131f"/>
      <stop offset="1" stop-color="#0d2332"/>
    </linearGradient>
    <linearGradient id="agentCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#103b43"/>
      <stop offset="1" stop-color="#102c3c"/>
    </linearGradient>
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#9fb8cb" opacity="0.10"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000814" flood-opacity="0.42"/>
    </filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L11 5.5 L0 11 Z" fill="#718fa2"/>
    </marker>
    <marker id="arrowBlue" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L11 5.5 L0 11 Z" fill="#6fb5ff"/>
    </marker>
    <marker id="arrowGreen" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L11 5.5 L0 11 Z" fill="#55e6c1"/>
    </marker>
    <marker id="arrowGold" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L11 5.5 L0 11 Z" fill="#ffbd73"/>
    </marker>
  </defs>

  <rect width="1600" height="800" rx="32" fill="url(#background)"/>
  <rect width="1600" height="800" rx="32" fill="url(#dots)"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="60" y="62" fill="#f3f7fa" font-size="34" font-weight="820">Путь задания через систему</text>
    <text x="60" y="96" fill="#90aabb" font-size="18">сначала официальный источник · затем агент и поиск · в конце единая оценка</text>

    <!-- 1. Task -->
    <g transform="translate(60 300)" filter="url(#shadow)">
      <rect width="220" height="190" rx="24" fill="#102737" stroke="#45677c" stroke-width="2"/>
      <circle cx="34" cy="34" r="18" fill="#6fb5ff"/>
      <text x="34" y="41" text-anchor="middle" fill="#07131f" font-size="19" font-weight="850">1</text>
      <rect x="28" y="68" width="58" height="68" rx="9" fill="#173b4d" stroke="#8fc8ff" stroke-width="2"/>
      <path d="M42 88 H72 M42 102 H68 M42 116 H72" stroke="#9bcfff" stroke-width="4" stroke-linecap="round"/>
      <text x="103" y="90" fill="#f2f7fa" font-size="22" font-weight="800">ЗАДАНИЕ</text>
      <text x="103" y="120" fill="#a4bac7" font-size="15">текст или</text>
      <text x="103" y="142" fill="#a4bac7" font-size="15">изображение</text>
      <text x="28" y="170" fill="#7897a9" font-size="13">предмет · класс · вопрос</text>
    </g>

    <!-- 2. Source check -->
    <g transform="translate(340 250)" filter="url(#shadow)">
      <rect width="300" height="290" rx="26" fill="#28253b" stroke="#b28cff" stroke-width="2.5"/>
      <circle cx="38" cy="38" r="18" fill="#b28cff"/>
      <text x="38" y="45" text-anchor="middle" fill="#161227" font-size="19" font-weight="850">2</text>
      <text x="70" y="45" fill="#f2f7fa" font-size="18" font-weight="800">ПРОВЕРКА ИСТОЧНИКА</text>
      <text x="28" y="80" fill="#d5c6ff" font-size="15" font-weight="700">Только наблюдаемый</text>
      <text x="28" y="101" fill="#d5c6ff" font-size="15" font-weight="700">текст задания</text>

      <g transform="translate(28 116)">
        <rect width="244" height="56" rx="16" fill="#6fb5ff" opacity="0.13" stroke="#6fb5ff" stroke-opacity="0.65"/>
        <circle cx="28" cy="28" r="11" fill="#6fb5ff" opacity="0.24"/>
        <path d="M23 28 L27 32 L34 23" fill="none" stroke="#9bcfff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="50" y="25" fill="#cde7ff" font-size="14" font-weight="760">ТОЧНОЕ СОВПАДЕНИЕ</text>
        <text x="50" y="43" fill="#93afc2" font-size="12">ответ берётся из ключа</text>
      </g>

      <g transform="translate(28 181)">
        <rect width="244" height="56" rx="16" fill="#55e6c1" opacity="0.10" stroke="#55e6c1" stroke-opacity="0.58"/>
        <circle cx="28" cy="28" r="11" fill="#55e6c1" opacity="0.22"/>
        <path d="M23 28 H34" stroke="#9ff3df" stroke-width="2.5" stroke-linecap="round"/>
        <text x="50" y="25" fill="#c6f8ec" font-size="14" font-weight="760">НЕТ СОВПАДЕНИЯ</text>
        <text x="50" y="43" fill="#93afc2" font-size="12">задание передаётся агенту</text>
      </g>

      <rect x="28" y="250" width="244" height="20" rx="10" fill="#b28cff" opacity="0.14"/>
      <text x="150" y="264" text-anchor="middle" fill="#d5c6ff" font-size="11" font-weight="750">ЭТАЛОННЫЙ ОТВЕТ СКРЫТ</text>
    </g>

    <!-- Official answer -->
    <g transform="translate(730 120)" filter="url(#shadow)">
      <rect width="320" height="190" rx="25" fill="#142f3d" stroke="#6fb5ff" stroke-width="2"/>
      <circle cx="42" cy="42" r="20" fill="#6fb5ff" opacity="0.18"/>
      <path d="M32 42 L39 49 L52 33" fill="none" stroke="#9bcfff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="76" y="49" fill="#f2f7fa" font-size="23" font-weight="800">ОТВЕТ ИЗ КЛЮЧА</text>
      <text x="30" y="93" fill="#cde7ff" font-size="17" font-weight="700">Надёжная привязка к источнику</text>
      <text x="30" y="127" fill="#8faabb" font-size="15">без вызова модели</text>
      <text x="30" y="153" fill="#8faabb" font-size="15">без поиска по учебникам</text>
    </g>

    <!-- 3. Agent -->
    <g transform="translate(730 390)" filter="url(#shadow)">
      <rect width="350" height="310" rx="27" fill="url(#agentCard)" stroke="#55e6c1" stroke-width="2.5"/>
      <circle cx="40" cy="40" r="18" fill="#55e6c1"/>
      <text x="40" y="47" text-anchor="middle" fill="#07251f" font-size="19" font-weight="850">3</text>
      <text x="72" y="47" fill="#f2f7fa" font-size="23" font-weight="800">АГЕНТ</text>

      <text x="31" y="91" fill="#b9f4e6" font-size="17" font-weight="700">1 · читает исходное изображение</text>
      <text x="31" y="130" fill="#b9f4e6" font-size="17" font-weight="700">2 · формирует поисковый запрос</text>
      <text x="31" y="169" fill="#b9f4e6" font-size="17" font-weight="700">3 · отбрасывает противоречия</text>
      <text x="31" y="208" fill="#b9f4e6" font-size="17" font-weight="700">4 · проверяет числа и вопрос</text>

      <g transform="translate(31 244)">
        <rect width="124" height="34" rx="17" fill="#55e6c1" opacity="0.14"/>
        <text x="62" y="22" text-anchor="middle" fill="#9ff3df" font-size="12" font-weight="760">ДО 2 ПОИСКОВ</text>
        <rect x="136" width="174" height="34" rx="17" fill="#6fb5ff" opacity="0.13"/>
        <text x="223" y="22" text-anchor="middle" fill="#a8d4ff" font-size="12" font-weight="760">1 ПЕРЕФОРМУЛИРОВКА</text>
      </g>
    </g>

    <!-- 4. Result and evaluation -->
    <g transform="translate(1170 120)" filter="url(#shadow)">
      <rect width="360" height="220" rx="25" fill="#2c2836" stroke="#ffbd73" stroke-width="2"/>
      <circle cx="40" cy="40" r="18" fill="#ffbd73"/>
      <text x="40" y="47" text-anchor="middle" fill="#2a1d10" font-size="19" font-weight="850">4</text>
      <text x="72" y="47" fill="#f2f7fa" font-size="22" font-weight="800">РЕЗУЛЬТАТ И ОЦЕНКА</text>
      <text x="30" y="89" fill="#ffd7a9" font-size="16" font-weight="700">Единый формат результата</text>
      <text x="30" y="117" fill="#aa9b8b" font-size="14">ответ · решение · история действий</text>
      <path d="M30 139 H330" stroke="#5b4c52" stroke-width="1.5"/>
      <text x="30" y="169" fill="#ffd7a9" font-size="16" font-weight="700">Слепая проверка по эталону</text>
      <text x="30" y="197" fill="#aa9b8b" font-size="14">точность · предметы · улучшения и ухудшения</text>
    </g>

    <!-- Textbook search -->
    <g transform="translate(1170 430)" filter="url(#shadow)">
      <rect width="360" height="270" rx="26" fill="#142c3a" stroke="#6fb5ff" stroke-width="2.5"/>
      <circle cx="40" cy="40" r="18" fill="#6fb5ff" opacity="0.19"/>
      <circle cx="36" cy="36" r="8" fill="none" stroke="#9bcfff" stroke-width="3"/>
      <path d="M42 42 L51 51" stroke="#9bcfff" stroke-width="3" stroke-linecap="round"/>
      <text x="73" y="47" fill="#f2f7fa" font-size="22" font-weight="800">ПОИСК ПО УЧЕБНИКАМ</text>

      <text x="31" y="92" fill="#cde7ff" font-size="17" font-weight="700">1 · поиск по словам и смыслу</text>
      <text x="31" y="131" fill="#cde7ff" font-size="17" font-weight="700">2 · объединение кандидатов</text>
      <text x="31" y="170" fill="#cde7ff" font-size="17" font-weight="700">3 · повторное ранжирование</text>
      <text x="31" y="209" fill="#cde7ff" font-size="17" font-weight="700">4 · порог релевантности 0,50</text>

      <rect x="31" y="229" width="298" height="24" rx="12" fill="#6fb5ff" opacity="0.14"/>
      <text x="180" y="246" text-anchor="middle" fill="#a8d4ff" font-size="12" font-weight="760">5 ЛУЧШИХ ФРАГМЕНТОВ ДЛЯ АГЕНТА</text>
    </g>

    <!-- Main arrows -->
    <path d="M280 395 H340" fill="none" stroke="#718fa2" stroke-width="4" marker-end="url(#arrow)"/>

    <path d="M640 320 C684 320 680 215 730 215" fill="none" stroke="#6fb5ff" stroke-width="4" marker-end="url(#arrowBlue)"/>
    <rect x="646" y="242" width="138" height="28" rx="14" fill="#10283a" stroke="#6fb5ff" stroke-opacity="0.45"/>
    <text x="715" y="261" text-anchor="middle" fill="#a8d4ff" font-size="12" font-weight="760">СОВПАДЕНИЕ</text>

    <path d="M640 470 H682 V355 H770 V390" fill="none" stroke="#55e6c1" stroke-width="4" marker-end="url(#arrowGreen)"/>
    <rect x="651" y="335" width="154" height="28" rx="14" fill="#102f35" stroke="#55e6c1" stroke-opacity="0.45"/>
    <text x="728" y="354" text-anchor="middle" fill="#9ff3df" font-size="12" font-weight="760">НЕТ СОВПАДЕНИЯ</text>

    <path d="M1050 215 H1170" fill="none" stroke="#6fb5ff" stroke-width="4" marker-end="url(#arrowBlue)"/>
    <path d="M905 390 V355 C905 330 1125 350 1170 290" fill="none" stroke="#55e6c1" stroke-width="4" marker-end="url(#arrowGreen)"/>

    <path d="M1080 545 H1170" fill="none" stroke="#ffbd73" stroke-width="4" marker-end="url(#arrowGold)"/>
    <path d="M1350 700 V750 H905 V700" fill="none" stroke="#55e6c1" stroke-width="4" marker-end="url(#arrowGreen)"/>
    <rect x="1015" y="724" width="320" height="30" rx="15" fill="#0c3035" stroke="#55e6c1" stroke-opacity="0.40"/>
    <text x="1175" y="744" text-anchor="middle" fill="#9ff3df" font-size="12" font-weight="760">ФРАГМЕНТЫ ВОЗВРАЩАЮТСЯ АГЕНТУ</text>
  </g>
</svg>
