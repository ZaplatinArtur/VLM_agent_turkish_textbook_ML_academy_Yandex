<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500" role="img" aria-labelledby="title desc">
  <title id="title">Turkish Textbook VLM Agent</title>
  <desc id="desc">A visual banner showing a multimodal homework agent connected to textbook retrieval, web search and evaluation.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07121f"/>
      <stop offset="0.55" stop-color="#0b1b2a"/>
      <stop offset="1" stop-color="#10283a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#55e6c1"/>
      <stop offset="0.52" stop-color="#6fb5ff"/>
      <stop offset="1" stop-color="#b28cff"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#55e6c1" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#55e6c1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#9fb8cb" opacity="0.12"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000814" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1600" height="500" rx="34" fill="url(#background)"/>
  <rect width="1600" height="500" rx="34" fill="url(#dots)"/>
  <circle cx="1340" cy="80" r="340" fill="url(#glow)"/>
  <path d="M0 462 C350 405 510 510 850 445 C1130 390 1310 470 1600 405 L1600 500 L0 500 Z" fill="#55e6c1" opacity="0.035"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <g transform="translate(88 78)">
      <rect x="0" y="0" width="184" height="36" rx="18" fill="#55e6c1" opacity="0.12" stroke="#55e6c1" stroke-opacity="0.45"/>
      <circle cx="22" cy="18" r="5" fill="#55e6c1"/>
      <text x="38" y="23" fill="#9ff3df" font-size="15" font-weight="700" letter-spacing="1.8">RESEARCH SYSTEM</text>

      <text x="0" y="108" fill="#f4f8fb" font-size="54" font-weight="800" letter-spacing="-1.5">Turkish Textbook</text>
      <text x="0" y="172" fill="url(#accent)" font-size="64" font-weight="850" letter-spacing="-2">VLM Agent</text>
      <text x="0" y="220" fill="#a9bdcc" font-size="22">Multimodal homework solving with controlled textbook RAG</text>

      <g transform="translate(0 272)">
        <rect width="178" height="46" rx="13" fill="#0c2130" stroke="#27475b"/>
        <text x="89" y="29" text-anchor="middle" fill="#d7e5ee" font-size="16" font-weight="650">Qwen 3.5 9B</text>
        <rect x="192" width="174" height="46" rx="13" fill="#0c2130" stroke="#27475b"/>
        <text x="279" y="29" text-anchor="middle" fill="#d7e5ee" font-size="16" font-weight="650">Direct Retrieval</text>
        <rect x="380" width="174" height="46" rx="13" fill="#0c2130" stroke="#27475b"/>
        <text x="467" y="29" text-anchor="middle" fill="#d7e5ee" font-size="16" font-weight="650">LLM Judge</text>
      </g>
    </g>

    <g transform="translate(930 64)" filter="url(#shadow)">
      <path d="M184 172 C78 126 80 75 18 66" fill="none" stroke="#678ba1" stroke-width="3" stroke-dasharray="7 9"/>
      <path d="M184 172 C78 190 74 245 18 258" fill="none" stroke="#678ba1" stroke-width="3" stroke-dasharray="7 9"/>
      <path d="M224 206 C270 264 352 267 410 258" fill="none" stroke="#678ba1" stroke-width="3" stroke-dasharray="7 9"/>

      <g transform="translate(120 100)">
        <rect width="252" height="176" rx="28" fill="#102a3b" stroke="#55e6c1" stroke-width="2"/>
        <circle cx="126" cy="66" r="35" fill="#55e6c1" opacity="0.14"/>
        <path d="M109 66 L122 79 L146 51" fill="none" stroke="#55e6c1" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="126" y="126" text-anchor="middle" fill="#f2f7fa" font-size="20" font-weight="750">VLM AGENT</text>
        <text x="126" y="150" text-anchor="middle" fill="#88a6b9" font-size="13" letter-spacing="1.2">IMAGE-FIRST</text>
      </g>

      <g>
        <rect width="205" height="118" rx="22" fill="#0d2231" stroke="#38556a"/>
        <circle cx="42" cy="40" r="18" fill="#6fb5ff" opacity="0.18"/>
        <path d="M33 35 H51 M33 42 H48 M33 49 H45" stroke="#7fc0ff" stroke-width="3" stroke-linecap="round"/>
        <text x="28" y="83" fill="#ecf4f8" font-size="17" font-weight="700">TEXTBOOK RAG</text>
        <text x="28" y="103" fill="#7998ab" font-size="12">direct checked retrieval</text>
      </g>

      <g transform="translate(0 306)">
        <rect width="205" height="118" rx="22" fill="#0d2231" stroke="#38556a"/>
        <circle cx="42" cy="40" r="18" fill="#ffbd73" opacity="0.18"/>
        <circle cx="39" cy="37" r="8" fill="none" stroke="#ffbd73" stroke-width="3"/>
        <path d="M46 44 L54 52" stroke="#ffbd73" stroke-width="3" stroke-linecap="round"/>
        <text x="28" y="83" fill="#ecf4f8" font-size="17" font-weight="700">WEB SEARCH</text>
        <text x="28" y="103" fill="#7998ab" font-size="12">controlled baseline</text>
      </g>

      <g transform="translate(410 306)">
        <rect width="205" height="118" rx="22" fill="#0d2231" stroke="#38556a"/>
        <circle cx="42" cy="40" r="18" fill="#b28cff" opacity="0.18"/>
        <path d="M32 48 V39 M42 48 V30 M52 48 V35" stroke="#c3a6ff" stroke-width="4" stroke-linecap="round"/>
        <text x="28" y="83" fill="#ecf4f8" font-size="17" font-weight="700">EVALUATION</text>
        <text x="28" y="103" fill="#7998ab" font-size="12">judge + paired metrics</text>
      </g>
    </g>
  </g>
</svg>
